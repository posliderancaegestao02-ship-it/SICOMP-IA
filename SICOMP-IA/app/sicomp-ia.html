<title>SICOMP-IA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --royal:#1E3A8A; --royal-ink:#142868; --royal-soft:#E7ECFA; --royal-line:#C3CEEF;
    --honey:#C98A22; --honey-soft:#F7ECD8; --honey-line:#E6C685;
    --paper:#F3F5FA; --surface:#FFFFFF; --surface-2:#F8F9FC;
    --ink:#1B2233; --ink-soft:#545F78; --ink-faint:#8791A8;
    --line:#DEE3EF; --line-soft:#ECEFF6;
    --crit:#B23A2E; --crit-soft:#FBEAE7; --warn:#B4791A; --warn-soft:#FBF1DE;
    --info:#2C6C9C; --info-soft:#E3EFF7; --ok:#2E7D5B; --ok-soft:#E5F2EC;
    --shadow:0 1px 2px rgba(20,40,104,.06), 0 10px 28px -14px rgba(20,40,104,.22);
    --radius:12px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --royal:#8EA9EC; --royal-ink:#CBD8F8; --royal-soft:#1B2748; --royal-line:#31437A;
      --honey:#E7B155; --honey-soft:#332711; --honey-line:#6B4F1E;
      --paper:#0C1120; --surface:#141A2C; --surface-2:#111729;
      --ink:#E8EBF6; --ink-soft:#AEB7D0; --ink-faint:#7C87A0;
      --line:#2A3252; --line-soft:#1E2542;
      --crit:#E5897C; --crit-soft:#3A2320; --warn:#E3B269; --warn-soft:#382D18;
      --info:#86B7E0; --info-soft:#1B2E3E; --ok:#86CBA9; --ok-soft:#16281F;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --royal:#8EA9EC; --royal-ink:#CBD8F8; --royal-soft:#1B2748; --royal-line:#31437A;
    --honey:#E7B155; --honey-soft:#332711; --honey-line:#6B4F1E;
    --paper:#0C1120; --surface:#141A2C; --surface-2:#111729;
    --ink:#E8EBF6; --ink-soft:#AEB7D0; --ink-faint:#7C87A0;
    --line:#2A3252; --line-soft:#1E2542;
    --crit:#E5897C; --crit-soft:#3A2320; --warn:#E3B269; --warn-soft:#382D18;
    --info:#86B7E0; --info-soft:#1B2E3E; --ok:#86CBA9; --ok-soft:#16281F;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;font-size:14.5px;line-height:1.5;}
  button{font-family:inherit;}
  ::selection{background:var(--honey-soft);}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  a{color:var(--royal);}
  :focus-visible{outline:2px solid var(--honey); outline-offset:1px; border-radius:4px;}

  /* ---------- shell ---------- */
  #app{display:grid;grid-template-columns:216px 1fr;grid-template-rows:52px 1fr;grid-template-areas:"top top" "nav main";height:100vh;}
  #app.login-mode{grid-template-columns:1fr;grid-template-areas:"top" "main";}
  #app.login-mode #sidenav{display:none;}

  header#topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--royal);color:#fff;box-shadow:var(--shadow);z-index:5;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.01em;font-size:15px;}
  .brand .sq{width:20px;height:20px;border-radius:5px;background:var(--honey);display:inline-block;}
  #topbar .who{display:flex;align-items:center;gap:10px;font-size:12.5px;}
  #topbar .who .u-unit{color:#C9D6F6;}
  #topbar .who button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:12px;}
  #topbar .who button:hover{background:rgba(255,255,255,.22);}

  nav#sidenav{grid-area:nav;background:var(--surface);border-right:1px solid var(--line);padding:12px 8px;overflow-y:auto;}
  nav#sidenav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--ink-soft);text-decoration:none;font-size:13px;font-weight:500;margin-bottom:2px;}
  nav#sidenav a:hover{background:var(--surface-2);color:var(--ink);}
  nav#sidenav a.active{background:var(--royal-soft);color:var(--royal-ink);font-weight:700;}
  nav#sidenav a.active .dot{background:var(--honey);}
  nav#sidenav .dot{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none;}
  nav#sidenav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin:14px 10px 6px;}
  nav#sidenav .grp:first-child{margin-top:4px;}

  main#view{grid-area:main;overflow-y:auto;padding:22px 26px 70px;}
  .view-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .view-head h1{font-size:19px;margin:0;color:var(--royal-ink);font-weight:800;letter-spacing:-.01em;}
  .view-head .sub{font-size:12.5px;color:var(--ink-faint);}
  .actions{display:flex;gap:8px;}

  /* ---------- primitives ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .pad{padding:16px 18px;}
  .grid{display:grid;gap:14px;}
  .g-kpi{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
  .g-2{grid-template-columns:1fr 1fr;}
  .g-main-side{grid-template-columns:1.6fr 1fr;}
  @media (max-width:920px){.g-main-side,.g-2{grid-template-columns:1fr;}}

  .kpi{padding:14px 16px;}
  .kpi .l{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
  .kpi .n{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:25px;margin-top:3px;font-variant-numeric:tabular-nums;}
  .kpi .n.crit{color:var(--crit);} .kpi .n.warn{color:var(--warn);} .kpi .n.ok{color:var(--ok);} .kpi .n.royal{color:var(--royal-ink);}

  .btn{border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);padding:8px 14px;font-size:12.8px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--ink-faint);color:var(--ink);}
  .btn-primary{background:var(--honey);border-color:var(--honey);color:#3A2A08;}
  .btn-primary:hover{background:var(--honey);filter:brightness(1.06);color:#3A2A08;}
  .btn-ghost{background:transparent;}
  .btn-danger-outline{border-color:var(--crit);color:var(--crit);background:transparent;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.sm{padding:5px 10px;font-size:11.5px;}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field label{font-size:11.5px;font-weight:600;color:var(--ink-soft);}
  .field input,.field select,.field textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);}
  .field textarea{resize:vertical;min-height:60px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--royal-line);border-color:var(--royal);}
  .field .hint{font-size:11px;color:var(--ink-faint);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;font-size:10.8px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--surface-2);}
  .table-wrap{overflow-x:auto;}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
  .pill.crit{background:var(--crit-soft);color:var(--crit);} .pill.warn{background:var(--warn-soft);color:var(--warn);}
  .pill.ok{background:var(--ok-soft);color:var(--ok);} .pill.info{background:var(--info-soft);color:var(--info);}
  .pill.neutral{background:var(--surface-2);color:var(--ink-faint);border:1px solid var(--line);}

  .alertcard{display:flex;gap:12px;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;}
  .alertcard:hover{border-color:var(--ink-faint);}
  .alertcard .stripe{width:4px;border-radius:3px;flex:none;}
  .alertcard .stripe.crit{background:var(--crit);} .alertcard .stripe.warn{background:var(--warn);} .alertcard .stripe.info{background:var(--info);}
  .alertcard .t{font-weight:700;font-size:13px;margin-bottom:2px;}
  .alertcard .d{font-size:12px;color:var(--ink-faint);}

  .modal-bg{position:fixed;inset:0;background:rgba(15,20,40,.45);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:var(--surface);border-radius:14px;max-width:640px;width:92%;max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px -20px rgba(0,0,0,.5);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-size:15px;}
  .modal-body{padding:18px 20px;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
  .x-close{background:none;border:none;font-size:18px;color:var(--ink-faint);cursor:pointer;line-height:1;}

  .empty{padding:28px;text-align:center;color:var(--ink-faint);font-size:13px;}
  .banner{padding:11px 14px;border-radius:9px;font-size:12.8px;display:flex;gap:8px;align-items:flex-start;margin-bottom:14px;}
  .banner.info{background:var(--info-soft);color:var(--info);} .banner.warn{background:var(--warn-soft);color:var(--warn);}
  .banner.crit{background:var(--crit-soft);color:var(--crit);} .banner.ok{background:var(--ok-soft);color:var(--ok);}

  .stepgroup{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;}
  .stephead{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;cursor:pointer;background:var(--surface-2);font-weight:700;font-size:13px;}
  .stepbody{padding:4px 14px 10px;}
  .steprow{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px dashed var(--line-soft);font-size:12.6px;}
  .steprow:last-child{border-bottom:none;}
  .steprow .name{display:flex;gap:8px;align-items:center;}

  .chat-log{display:flex;flex-direction:column;gap:12px;max-height:52vh;overflow-y:auto;padding:4px;}
  .msg-user{align-self:flex-end;background:var(--royal);color:#fff;padding:9px 13px;border-radius:12px 12px 3px 12px;max-width:70%;font-size:13px;}
  .msg-ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);padding:12px 14px;border-radius:12px 12px 12px 3px;max-width:88%;}
  .msg-ai .ans{font-size:13.2px;margin-bottom:8px;}
  .explain{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:11.5px;border-top:1px dashed var(--line);padding-top:8px;}
  .explain dt{color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;font-size:10px;font-weight:700;}
  .explain dd{margin:0;color:var(--ink-soft);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--ink-soft);}
  .chip:hover{border-color:var(--royal);color:var(--royal-ink);}
  .chatbar{display:flex;gap:8px;margin-top:12px;}
  .chatbar input{flex:1;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);}

  .sparkwrap{width:100%;overflow-x:auto;}
  svg.chart text{font-family:'Public Sans',sans-serif;fill:var(--ink-faint);font-size:9.5px;}
  .plot-hist{fill:none;stroke:var(--royal);stroke-width:2;}
  .plot-fore{fill:none;stroke:var(--honey);stroke-width:2;stroke-dasharray:4 3;}
  .axis{stroke:var(--line);stroke-width:1;}
  .bar{fill:var(--royal);}
  .grid-line{stroke:var(--line-soft);stroke-width:1;}

  h2.sec{font-size:13px;margin:0 0 10px;color:var(--ink);font-weight:700;}
  .muted{color:var(--ink-faint);}
  .small{font-size:12px;}
  .flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;} .gap8{gap:8px;} .gap12{gap:12px;}
  .w100{width:100%;}
  .restricted{padding:60px 20px;text-align:center;color:var(--ink-faint);}

  /* login */
  #view.login{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 52px);}
  .login-card{width:380px;padding:34px 32px;text-align:center;}
  .login-card .sq{width:44px;height:44px;border-radius:11px;background:var(--honey);margin:0 auto 14px;}
  .login-card h1{font-size:19px;margin:0 0 2px;color:var(--royal-ink);}
  .login-card .tag{font-size:12px;color:var(--ink-faint);margin-bottom:22px;}
</style>

<div id="app">
  <header id="topbar">
    <div class="brand"><span class="sq"></span>SICOMP-IA</div>
    <div class="who" id="who-box"></div>
  </header>
  <nav id="sidenav"></nav>
  <main id="view"></main>
</div>
<div id="modal-root"></div>

<script>
/* =========================================================================
   SICOMP-IA — protótipo funcional (Etapa 3)
   Dados fictícios. Toda a lógica (duplicidade, previsão de consumo,
   priorização, alertas) roda de verdade em cima do estado abaixo.
   ========================================================================= */

const PERFIS = ["Área Demandante","Gerência de Planejamento","Gerência de Compras Governamentais","Gerência de Execução Financeira e Orçamentária","Gestor do Contrato","Setorial Jurídica","Almoxarifado","Auditoria e Controle Interno"];

const NAV = [
  {grp:"Visão geral"},
  {key:"painel", label:"Painel geral", perfis: PERFIS},
  {key:"alertas", label:"Central de alertas", perfis: PERFIS},
  {grp:"Demandas e planejamento"},
  {key:"demandas", label:"Demandas", perfis:["Área Demandante","Gerência de Planejamento","Gerência de Compras Governamentais","Gestor do Contrato","Auditoria e Controle Interno"]},
  {key:"planejamento", label:"Planejamento anual", perfis:["Gerência de Planejamento","Gerência de Compras Governamentais","Gerência de Execução Financeira e Orçamentária","Auditoria e Controle Interno"]},
  {grp:"Execução"},
  {key:"processos", label:"Processos de contratação", perfis:["Área Demandante","Gerência de Planejamento","Gerência de Compras Governamentais","Gerência de Execução Financeira e Orçamentária","Gestor do Contrato","Setorial Jurídica","Auditoria e Controle Interno"]},
  {key:"contratos", label:"Contratos e atas", perfis:["Área Demandante","Gerência de Planejamento","Gerência de Compras Governamentais","Gerência de Execução Financeira e Orçamentária","Gestor do Contrato","Setorial Jurídica","Almoxarifado","Auditoria e Controle Interno"]},
  {key:"estoque", label:"Estoque", perfis:["Gerência de Planejamento","Gerência de Compras Governamentais","Gestor do Contrato","Almoxarifado","Auditoria e Controle Interno"]},
  {grp:"Inteligência"},
  {key:"assistente", label:"Assistente de IA", perfis: PERFIS},
  {key:"relatorios", label:"Relatórios e indicadores", perfis:["Área Demandante","Gerência de Planejamento","Gerência de Execução Financeira e Orçamentária","Gestor do Contrato","Auditoria e Controle Interno"]},
  {grp:"Governança"},
  {key:"admin", label:"Perfis e auditoria", perfis:["Auditoria e Controle Interno"]},
];

// ---------------------------------------------------------------------------
// DADOS FICTÍCIOS
// ---------------------------------------------------------------------------
const today = new Date("2026-09-13");
const iso = d => d.toISOString().slice(0,10);
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);

const DB = {
  unidades: [
    {id:"u1", nome:"Sede — Almoxarifado Central"},
    {id:"u2", nome:"Batalhão de Choque"},
    {id:"u3", nome:"Delegacia Metropolitana de Goiânia"},
    {id:"u4", nome:"Delegacia Norte"},
    {id:"u5", nome:"Delegacia Sul"},
    {id:"u6", nome:"Academia de Polícia Civil"},
    {id:"u7", nome:"Instituto de Criminalística"},
    {id:"u8", nome:"Coordenação de Licitações"},
  ],
  fornecedores: [
    {id:"f1", nome:"Papelaria Central Ltda.", cnpj:"12.345.678/0001-90"},
    {id:"f2", nome:"AutoManutenção Goiás S.A.", cnpj:"98.765.432/0001-10"},
    {id:"f3", nome:"Proteção Balística Brasil Ltda.", cnpj:"22.111.333/0001-44"},
    {id:"f4", nome:"MedForense Suprimentos Ltda.", cnpj:"33.222.444/0001-55"},
  ],
  itens: [
    {id:"i1", codigo:"OPR-0231", descricao:"Colete balístico nível III-A", categoria:"Operacional", unidade:"un", criticidade:5, min:30, max:200, saldoContratado:220},
    {id:"i2", codigo:"ADM-0104", descricao:"Papel A4 (resma 500 folhas)", categoria:"Administrativo", unidade:"resma", criticidade:2, min:150, max:1200, saldoContratado:1050},
    {id:"i3", codigo:"TEC-0087", descricao:"Toner para impressora laser", categoria:"Tecnológico", unidade:"un", criticidade:2, min:20, max:80, saldoContratado:80},
    {id:"i4", codigo:"MED-0512", descricao:"Kit de coleta de vestígios", categoria:"Médico-pericial", unidade:"kit", criticidade:4, min:100, max:500, saldoContratado:500},
    {id:"i5", codigo:"OPR-0198", descricao:"Munição calibre .40 (caixa 50un)", categoria:"Operacional", unidade:"caixa", criticidade:5, min:40, max:300, saldoContratado:260},
    {id:"i6", codigo:"TEC-0045", descricao:"Notebook corporativo 14 polegadas", categoria:"Tecnológico", unidade:"un", criticidade:3, min:5, max:40, saldoContratado:40},
    {id:"i7", codigo:"MED-0233", descricao:"Luva de procedimento (caixa 100un)", categoria:"Médico-pericial", unidade:"caixa", criticidade:3, min:40, max:300, saldoContratado:300},
  ],
  // saldo por unidade
  estoque: [
    {itemId:"i1", unidadeId:"u2", disponivel:22, reservado:0},
    {itemId:"i1", unidadeId:"u3", disponivel:35, reservado:0},
    {itemId:"i2", unidadeId:"u1", disponivel:64, reservado:0},
    {itemId:"i2", unidadeId:"u5", disponivel:14, reservado:0},
    {itemId:"i3", unidadeId:"u4", disponivel:4,  reservado:0},
    {itemId:"i3", unidadeId:"u5", disponivel:18, reservado:0},
    {itemId:"i4", unidadeId:"u7", disponivel:40, reservado:12, lote:"L2588", validade:"2027-02-01"},
    {itemId:"i5", unidadeId:"u2", disponivel:38, reservado:0},
    {itemId:"i6", unidadeId:"u8", disponivel:6,  reservado:0},
    {itemId:"i7", unidadeId:"u7", disponivel:52, reservado:0},
  ],
  // saídas históricas — base para aprendizagem de consumo
  movimentacoes: (() => {
    const list=[];
    for(let k=9;k>=0;k--) list.push({itemId:"i2", unidadeId:"u1", tipo:"saida", quantidade:95, data: iso(addDays(today,-(300-k*30)))});
    for(let k=2;k>=0;k--) list.push({itemId:"i3", unidadeId:"u5", tipo:"saida", quantidade:6, data: iso(addDays(today,-(250-k*80)))});
    for(let k=6;k>=0;k--) list.push({itemId:"i5", unidadeId:"u2", tipo:"saida", quantidade:14, data: iso(addDays(today,-(180-k*25)))});
    list.push({itemId:"i5", unidadeId:"u2", tipo:"saida", quantidade:60, data: iso(addDays(today,-40)), extraordinario:true, motivo:"Operação especial — reforço perimetral"});
    for(let k=3;k>=0;k--) list.push({itemId:"i4", unidadeId:"u7", tipo:"saida", quantidade:18, data: iso(addDays(today,-(90-k*22)))});
    return list;
  })(),
  demandas: [
    {id:"d1", numero:"2026-0341", unidadeId:"u2", itemId:"i1", quantidade:40, justificativa:"Reposição de itens vencidos identificados na inspeção trimestral do efetivo operacional.", urgencia:"Alta", prazo:"30 dias", local:"Sede — Almoxarifado", fonte:"Fundo de Segurança", status:"Em análise", data: iso(addDays(today,-5)), responsavel:"Ana Ferreira"},

// MOTOR 1 — SIMILARIDADE / DUPLICIDADE (Módulo 3)
// ---------------------------------------------------------------------------
function stripDiacritics(s){
  var map = {225:"a",224:"a",227:"a",226:"a",228:"a",233:"e",234:"e",232:"e",235:"e",237:"i",236:"i",238:"i",239:"i",243:"o",244:"o",245:"o",242:"o",246:"o",250:"u",249:"u",251:"u",252:"u",231:"c",241:"n"};
  s = s.toLowerCase();
  var out = "";
  for(var i=0;i<s.length;i++){ var code=s.charCodeAt(i); out += (map[code]||s[i]); }
  return out;
}
function normTokens(s){
  return stripDiacritics(s).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean);
}
function textSim(a,b){
  const ta=new Set(normTokens(a)), tb=new Set(normTokens(b));
  const inter=[...ta].filter(x=>tb.has(x)).length;
  const union=new Set([...ta,...tb]).size;
  return union? inter/union : 0;
}
function compareDemandas(a,b){
  let score=0; const matched=[];
  if(a.itemId===b.itemId){ score+=0.55; matched.push("mesmo item do catálogo padronizado"); }
  else {
    const ia=getItem(a.itemId), ib=getItem(b.itemId);
    const ts=textSim(ia.descricao, ib.descricao);
    if(ts>0.25){ score+=ts*0.4; matched.push("descrição textual semelhante"); }
    if(ia.categoria===ib.categoria){ score+=0.12; matched.push("mesma categoria"); }
  }
  const dd=Math.abs(daysBetween(a.data,b.data));
  if(dd<=60){ score+=0.15; matched.push("período próximo (≤60 dias)"); }
  if(a.status!=="Atendida" && b.status!=="Atendida"){ score+=0.12; matched.push("ambas ainda em aberto"); }
  return {score:Math.min(score,1), matched};
}
function findDuplicates(demanda){
  return DB.demandas
    .filter(d=>d.id!==demanda.id)
    .map(d=>({demanda:d, ...compareDemandas(demanda,d)}))
    .filter(r=>r.score>=0.55)
    .sort((a,b)=>b.score-a.score);
}
function severityFromScore(s){ return s>=0.85 ? "crit" : s>=0.70 ? "warn" : "info"; }

// MOTOR 2 — APRENDIZAGEM DE CONSUMO (Módulo 7/8)
// ---------------------------------------------------------------------------
function analyzeConsumption(itemId){
  const item = getItem(itemId);
  const recs = DB.movimentacoes.filter(m=>m.itemId===itemId && m.tipo==="saida" && !m.extraordinario).sort((a,b)=>new Date(a.data)-new Date(b.data));
  const extra = DB.movimentacoes.filter(m=>m.itemId===itemId && m.extraordinario);
  const n = recs.length;
  const total = recs.reduce((s,r)=>s+r.quantidade,0);
  const totalComExtra = total + extra.reduce((s,r)=>s+r.quantidade,0);
  const remaining = Math.max(item.saldoContratado - totalComExtra, 0);
  let rate=null, depletion=null, daysUntil=null;
  if(n>=2){
    const span = daysBetween(recs[0].data, recs[n-1].data);
    rate = span>0 ? total/span : total/n;
    if(rate>0){ daysUntil = Math.round(remaining/rate); depletion = iso(addDays(today,daysUntil)); }
  }
  const recurrent = n>=3;
  let risk = "ok";
  if(recurrent && daysUntil!==null){ risk = daysUntil<=30?"crit":daysUntil<=90?"warn":"ok"; }
  return {item, n, total:totalComExtra, remaining, rate, depletion, daysUntil, recurrent, risk, extra};
}

function estoquePorItem(itemId){ return DB.estoque.filter(e=>e.itemId===itemId); }
function saldoTotal(itemId){ return estoquePorItem(itemId).reduce((s,e)=>s+e.disponivel,0); }
function transferSuggestions(){
  const out=[];
  DB.itens.forEach(item=>{
    const rows = estoquePorItem(item.id);
    if(rows.length<2) return;
    const sorted = [...rows].sort((a,b)=>b.disponivel-a.disponivel);
    const donor = sorted[0], recipient = sorted[sorted.length-1];
    if(donor.unidadeId===recipient.unidadeId) return;
    const recipientNeed = item.min - recipient.disponivel;
    if(recipientNeed<=0) return;
    const donorSpare = donor.disponivel - Math.ceil(item.min*0.4);
    if(donorSpare<=0) return;
    const qtd = Math.round(Math.min(donorSpare, recipientNeed));
    if(qtd>0) out.push({item, de:donor.unidadeId, para:recipient.unidadeId, qtd});
  });
  return out;
}

function classifyDeadline(dateStr){
  if(!dateStr) return null;
  const d = daysBetween(iso(today), dateStr);
  if(d<=15) return "crit"; if(d<=45) return "warn"; if(d<=90) return "info"; return null;
}
function allAlerts(){
  const list=[];
  // contratos
  DB.contratos.forEach(c=>{
    const sev = classifyDeadline(c.vigenciaFim);
    if(sev) list.push({sev, tipo:"Prazo", msg:`${c.numero}: vigência ${daysBetween(iso(today),c.vigenciaFim)>=0?"vence em "+daysBetween(iso(today),c.vigenciaFim)+" dia(s)":"venceu"}`, view:"contratos"});
    if(c.garantia){ const s2=classifyDeadline(c.garantia); if(s2) list.push({sev:s2, tipo:"Prazo", msg:`${c.numero}: garantia vence em ${daysBetween(iso(today),c.garantia)} dia(s)`, view:"contratos"}); }
  });
  // processos
  DB.processos.forEach(p=>{
    if(p.status!=="Em andamento") return;
    const sev = classifyDeadline(p.faseDeadline);
    if(sev){
      const fase = p.fases[p.faseAtualIdx];
      list.push({sev, tipo:"Processo", msg:`SEI ${p.sei}: fase "${fase.nome}" com prazo em ${daysBetween(iso(today),p.faseDeadline)} dia(s)`, view:"processos", ref:p.id});
    }
  });
  // estoque / consumo
  DB.itens.forEach(it=>{
    const a = analyzeConsumption(it.id);
    if(a.recurrent && a.risk!=="ok") list.push({sev:a.risk, tipo:"Consumo", msg:`${it.descricao}: previsão de esgotamento em ${a.daysUntil} dia(s)`, view:"previsao", ref:it.id});
    const tot = saldoTotal(it.id);
    if(tot < it.min) list.push({sev:"warn", tipo:"Estoque", msg:`${it.descricao}: saldo total (${tot}) abaixo do mínimo (${it.min})`, view:"estoque"});
  });
  // duplicidades
  const seen=new Set();
  DB.demandas.forEach(d=>{
    if(d.status==="Consolidada"||d.status==="Atendida") return;
    findDuplicates(d).forEach(m=>{
      const key=[d.id,m.demanda.id].sort().join("-");
      if(seen.has(key)) return; seen.add(key);
      list.push({sev:severityFromScore(m.score), tipo:"Duplicidade", msg:`${Math.round(m.score*100)}% similar — ${getItem(d.itemId).descricao} (${d.numero} × ${m.demanda.numero})`, view:"duplicidade", ref:d.id});
    });
  });
  // qualidade
  DB.qualidade.forEach(q=>{
    if(q.nota==="regular"||q.nota==="insatisfatoria"){
      const c = DB.contratos.find(x=>x.id===q.contratoId);
      list.push({sev: q.nota==="insatisfatoria"?"crit":"warn", tipo:"Qualidade", msg:`${c.numero}: última avaliação de qualidade "${q.nota}"`, view:"contratos"});
    }
  });
  const order={crit:0,warn:1,info:2};
  return list.sort((a,b)=>order[a.sev]-order[b.sev]);
}
function recommendedActions(){
  const acts=[];
  allAlerts().filter(a=>a.sev==="crit").forEach(a=> acts.push(a.msg));
  transferSuggestions().forEach(t=> acts.push(`Transferir ${t.qtd} ${t.item.unidade} de ${t.item.descricao}: ${getUnidade(t.de).nome} → ${getUnidade(t.para).nome}`));
  return acts.slice(0,6);
}

function adviceContrato(c, tipo){
  const g = GESTAO[c.id]; const dias = daysBetween(iso(today), c.vigenciaFim);
  const pend = g.prorrogacao.filter(r=>!r.ok);
  const docsPend = g.documentos.filter(d=>d.sit!=="ok");
  const acoes = [...g.checklist.filter(x=>x.sit==="atrasado"), ...g.checklist.filter(x=>x.sit==="pendente").sort((a,b)=>new Date(a.prazo)-new Date(b.prazo))];
  const base = {dados:`Contrato ${c.numero}: vigência, garantia, checklist de fiscalização e documentos registrados no sistema`, validacao:"Necessária: a IA apenas recomenda; a decisão cabe ao gestor do contrato e à autoridade competente"};
  if(tipo==="prorrogar"){
    if(dias<0) return {...base, ans:`Não. O contrato venceu em ${fmtDate(c.vigenciaFim)} e a prorrogação precisa ser formalizada durante a vigência. Avaliar nova contratação ou adesão a ata vigente.`,
      criterios:"Prorrogação somente durante a vigência (Lei nº 14.133/2021)", confianca:"Alta (dado direto)", risco:"Desabastecimento do item", acao:"Abrir nova demanda ou verificar ata vigente para o mesmo objeto"};
    if(g.tipo==="ata") return {...base, ans:`Em tese, sim: a ata tem vigência de 1 ano, prorrogável por igual período se o preço continuar vantajoso. Faltam ${pend.length} requisito(s): ${pend.map(r=>r.req.toLowerCase()).join("; ")}. Vencimento em ${fmtDate(c.vigenciaFim)} (${dias} dias).`,
      criterios:"Art. 84 da Lei nº 14.133/2021 (vigência de 1 ano, prorrogável por igual período com preço vantajoso)", confianca:"Média: depende de pesquisa de preços ainda não anexada", risco: dias<=90?"Perda da ata antes da nova licitação":"Baixo no momento", acao:"Realizar pesquisa de vantajosidade e submeter à autoridade competente"};
    return {...base, ans:`A prorrogação é juridicamente possível, mas ainda não está instruída. Faltam ${pend.length} de ${g.prorrogacao.length} requisitos: ${pend.map(r=>r.req.toLowerCase()+(r.obs?` (${r.obs})`:"")).join("; ")}. A vigência termina em ${fmtDate(c.vigenciaFim)} (${dias} dias).`,
      criterios:"Arts. 106 e 107 da Lei nº 14.133/2021: contratos contínuos com vigência total de até 10 anos, previsão em edital e vantajosidade atestada", confianca:"Média: depende de documentos ainda não anexados",
      risco: dias<=90 ? `Descontinuidade do fornecimento se a decisão não sair até ${fmtDate(c.vigenciaFim)}` : "Baixo no momento",
      acao:"Solicitar a manifestação do fornecedor e a pesquisa de preços; em seguida, encaminhar à Setorial Jurídica"};
  }
  if(tipo==="documentos"){
    if(!docsPend.length) return {...base, ans:"Não há documentos pendentes para este contrato.", criterios:"Lista de documentos exigidos na fase de execução", confianca:"Alta (dado direto)", risco:"Nenhum", acao:"Manter o acompanhamento mensal"};
    return {...base, ans:`Sim, ${docsPend.length} documento(s): ${docsPend.map(d=>d.doc.toLowerCase()+(d.sit==="vencido"?" (vencido)":"")).join("; ")}.`,
      criterios:"Documentos exigidos na fase de execução e validade das certidões", confianca:"Alta (dado direto)",
      risco: docsPend.some(d=>d.sit==="vencido") ? "Pagamento sem comprovação de regularidade do fornecedor" : "Atraso na instrução do processo de pagamento",
      acao: docsPend.some(d=>d.sit==="vencido") ? "Solicitar ao fornecedor as certidões atualizadas antes de atestar o próximo pagamento" : "Providenciar os documentos pendentes"};
  }
  // o que fazer agora
  const top = acoes.slice(0,3).map(x=>`${x.item.toLowerCase()} (${x.sit==="atrasado"?"atrasado":"até "+fmtDate(x.prazo)})`);
  const extra = (dias>=0 && dias<=90 && g.prorrogacao.length) ? `; decidir sobre a prorrogação até ${fmtDate(c.vigenciaFim)}` : "";
  return {...base, ans: top.length ? `Prioridades: ${top.join("; ")}${extra}.` : `Nenhuma pendência de fiscalização${extra}.`,
    criterios:"Itens atrasados primeiro, depois pendentes por prazo; vencimentos de vigência e garantia", confianca:"Alta (dado direto)",
    risco: acoes.some(x=>x.sit==="atrasado") ? "Falha de fiscalização registrada em auditoria" : "Baixo", acao: top.length ? `Começar por: ${acoes[0].item.toLowerCase()}` : "Manter o acompanhamento"};
}

function timelineContrato(c){
  const pts=[{l:"Início",d:c.vigenciaInicio}];
  if(c.reajuste) pts.push({l:"Reajuste",d:c.reajuste});
  if(c.garantia) pts.push({l:"Garantia",d:c.garantia});
  pts.push({l:"Fim da vigência",d:c.vigenciaFim});
  const ini=new Date(c.vigenciaInicio), fim=new Date(Math.max(...pts.map(p=>new Date(p.d)), today));
  const X=d=> 40 + (new Date(d)-ini)/(fim-ini||1)*820;
  const tx=X(iso(today));
  const sorted=[...pts].sort((a,b)=>new Date(a.d)-new Date(b.d));
  return `<svg viewBox="0 0 900 120" width="100%" class="chart">
    <line class="axis" x1="40" y1="60" x2="860" y2="60"/>
    <line x1="${tx}" y1="22" x2="${tx}" y2="72" stroke="var(--royal)" stroke-dasharray="4 4"/>
    <text x="${tx}" y="16" text-anchor="middle" fill="var(--royal-ink)" style="font-weight:700">hoje</text>
    ${sorted.map((p,i)=>{const x=X(p.d); const crit=classifyDeadline(p.d)==="crit"; const up=i%2===0;
      return `<circle cx="${x}" cy="60" r="7" fill="${new Date(p.d)<today?'var(--ok)':crit?'var(--crit)':'var(--surface)'}" stroke="${crit?'var(--crit)':'var(--line)'}" stroke-width="2"/>
      <text x="${x}" y="${up?40:86}" text-anchor="middle" fill="var(--ink-soft)">${p.l}</text>
      <text x="${x}" y="${up?28:100}" text-anchor="middle" class="mono" fill="var(--ink-faint)">${fmtDate(p.d)}</text>`;}).join("")}
  </svg>`;
}

function contratoFromQuestion(ql){
  const byNum = DB.contratos.find(c=> ql.includes(c.numero.toLowerCase()));

function currentPerfil(){ return SESSION.user ? SESSION.user.perfil : null; }
const SUBROUTE_PARENT = {"nova-demanda":"demandas", "duplicidade":"demandas", "previsao":"estoque", "contrato":"contratos"};
function canAccess(key){
  const item = NAV.find(n=>n.key===(SUBROUTE_PARENT[key]||key));
  if(!item) return true;
  return item.perfis.includes(currentPerfil());
}

function navigate(hash){ location.hash = hash; }
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

function render(){
  closeModal();
  const app = document.getElementById("app");
  if(!SESSION.user){
    app.classList.add("login-mode");
    document.getElementById("sidenav").innerHTML="";
    document.getElementById("who-box").innerHTML="";
    renderLogin();
    return;
  }
  app.classList.remove("login-mode");
  renderChrome();
  const hash = (location.hash||"#/painel").replace("#/","");
  const [key, sub] = hash.split("/");
  const view = document.getElementById("view");
  view.className = "";
  if(!canAccess(key)){
    view.innerHTML = `<div class="restricted"><h2>Acesso restrito</h2><p>O perfil <b>${currentPerfil()}</b> não tem acesso a esta tela.</p><button class="btn" onclick="navigate('#/painel')">Voltar ao painel</button></div>`;
    return;
  }
  const map = {
    painel: renderPainel, alertas: renderAlertas, demandas: renderDemandas,
    "nova-demanda": renderNovaDemanda, duplicidade: ()=>renderDuplicidade(sub),
    planejamento: renderPlanejamento, processos: sub? ()=>renderProcessoDetalhe(sub) : renderProcessos,
    estoque: renderEstoque, previsao: renderPrevisao, contratos: renderContratos, contrato: ()=>renderGestaoContrato(sub),
    assistente: renderAssistente, relatorios: renderRelatorios, admin: renderAdmin,
  };
  (map[key]||renderPainel)();
}

  document.getElementById("who-box").innerHTML = `

  document.getElementById("btn-logout").onclick = ()=>{ SESSION.user=null; location.hash="#/painel"; render(); };

  const hash = (location.hash||"#/painel").replace("#/","").split("/")[0];
  let html="";

function sparkline(cons){
  if(!cons.rate) return `<div class="muted small">Histórico insuficiente para previsão.</div>`;
  const W=380,H=140,pad=28;
  const recs = DB.movimentacoes.filter(m=>m.itemId===cons.item.id && m.tipo==="saida" && !m.extraordinario).sort((a,b)=>new Date(a.data)-new Date(b.data));
  const cum=[]; let acc=0; recs.forEach(r=>{acc+=r.quantidade; cum.push(acc);});
  const maxY = Math.max(...cum, cons.total)*1.15;
  const stepX = (W-2*pad)/(recs.length+3);
  const histPts = cum.map((v,i)=> `${pad+i*stepX},${H-pad-(v/maxY)*(H-2*pad)}`).join(" ");
  const lastX = pad+(recs.length-1)*stepX, lastY = H-pad-(cum[cum.length-1]/maxY)*(H-2*pad);
  const forePts = [`${lastX},${lastY}`];
  for(let k=1;k<=3;k++){ const x=lastX+k*stepX; const y=H-pad-((acc+cons.rate*k*30)/maxY)*(H-2*pad); forePts.push(`${x},${Math.max(y,pad)}`); }
  return `<div class="sparkwrap"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">
    <line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-8}" y2="${H-pad}"/>
    <line class="axis" x1="${pad}" y1="8" x2="${pad}" y2="${H-pad}"/>
    <polyline class="plot-hist" points="${histPts}"/>
    <polyline class="plot-fore" points="${forePts.join(" ")}"/>
    <text x="${W-8}" y="${H-pad+14}" text-anchor="end">hoje →</text>
    <text x="${forePts[forePts.length-1].split(',')[0]}" y="${Math.max(parseFloat(forePts[forePts.length-1].split(',')[1])-8,14)}" text-anchor="end" fill="var(--honey)">esgota ${fmtDate(cons.depletion)}</text>
  </svg></div>
  <div class="small muted" style="margin-top:6px">Taxa: ${cons.rate.toFixed(2)} ${cons.item.unidade}/dia · saldo restante: ${cons.remaining} · risco: ${pill(cons.risk,sevLabel(cons.risk))}</div>`;
}

  const rows = DB.demandas.filter(d=>
    (!demandaFilters.unidade || d.unidadeId===demandaFilters.unidade) &&
    (!demandaFilters.status || d.status===demandaFilters.status) &&
    (!demandaFilters.urgencia || d.urgencia===demandaFilters.urgencia)

function priorityScore(d){
  const it = getItem(d.itemId);
  const cons = analyzeConsumption(it.id);
  const urgMap={Alta:100,Média:60,Baixa:30};
  const riskMap={crit:100,warn:60,ok:20};
  const score = urgMap[d.urgencia]*0.25 + riskMap[cons.risk]*0.20 + (it.criticidade*20)*0.20 + 50*0.15 + 70*0.10 + 60*0.10;
  return Math.round(score);
}
function renderPlanejamento(){
  const ativos = DB.demandas.filter(d=>d.status==="Aprovada"||d.status==="Em análise");
  const scored = ativos.map(d=>({d, score:priorityScore(d)})).sort((a,b)=>b.score-a.score);
  const quarters=[[],[],[],[]];
  scored.forEach((s,i)=> quarters[i%4].push(s));
  const total = ativos.reduce((s,d)=>s + (getItem(d.itemId).saldoContratado? 0:0),0);

function openEstoqueItem(itemId){
  const it=getItem(itemId); const rows=estoquePorItem(itemId);
  const sugg = transferSuggestions().filter(s=>s.item.id===itemId);
  openModal(`${it.descricao} — por unidade`, `
    <table><thead><tr><th>Unidade</th><th>Disponível</th><th>Reservado</th><th>Lote</th><th>Validade</th></tr></thead>
    <tbody>${rows.map(r=>`<tr style="cursor:default"><td>${getUnidade(r.unidadeId).nome}</td><td class="mono">${r.disponivel}</td><td class="mono">${r.reservado}</td><td class="mono">${r.lote||'—'}</td><td class="mono">${r.validade?fmtDate(r.validade):'—'}</td></tr>`).join("")}</tbody></table>
    ${sugg.length? `<div class="banner info" style="margin-top:12px">Sugestão de transferência: ${sugg.map(s=>`${s.qtd} ${it.unidade} de ${getUnidade(s.de).nome} → ${getUnidade(s.para).nome}`).join("; ")}</div>`:""}
  `, `<button class="btn" id="m-close">Fechar</button>${sugg.length?`<button class="btn btn-primary" id="m-transfer">Registrar transferência</button>`:""}`);
  document.getElementById("m-close").onclick = closeModal;
  const tBtn = document.getElementById("m-transfer");
  if(tBtn) tBtn.onclick = ()=>{
    const s=sugg[0];
    const de = DB.estoque.find(e=>e.itemId===itemId&&e.unidadeId===s.de);
    const para = DB.estoque.find(e=>e.itemId===itemId&&e.unidadeId===s.para);
    de.disponivel -= s.qtd; para.disponivel += s.qtd;
    log(`Transferência de ${it.descricao}`, `${s.qtd} un de ${getUnidade(s.de).nome} para ${getUnidade(s.para).nome}`);
    closeModal(); renderEstoque();
  };
}

const SUGGESTED_Q = [

function renderAssistente(){
  document.getElementById("view").innerHTML = `

      </div>

  document.getElementById("chips").innerHTML = SUGGESTED_Q.map(q=>`<span class="chip">${q}</span>`).join("");
  document.querySelectorAll("#chips .chip").forEach(c=> c.onclick=()=> askAndRender(c.textContent));

function askAndRender(q){
  const log_ = document.getElementById("chat-log");

  a.innerHTML = `<div class="ans">${r.ans}</div><dl class="explain">

  log(`Consulta ao assistente: "${q}"`);
}
